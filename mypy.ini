# Progressive typing gate for the calculation core.
#
# The project is not annotated end to end, so this is deliberately "mypy-lite":
# `modules/` is checked with `--check-untyped-defs`, which type-checks the body
# of every function even when a signature is still unannotated. That catches
# real mistakes (a float assigned to an integer counter, an Optional used
# without a guard, a loop variable reused for a different record type) without
# requiring a full annotation campaign first.
#
# Scope is `modules/` only: it holds every formula and the import/migration
# pipeline, where a silent type confusion changes damage numbers. The Qt layer
# in `gui/` is exercised by the widget tests instead, and `tools/`, `tests/`
# and the one-off analysis scripts are not part of the shipped calculation.
#
# CI runs `python -m mypy` from the repository root, so this file is the single
# source of truth; a local run is authoritative.
[mypy]
python_version = 3.11
files = modules

# Third-party packages without type information (openpyxl) would otherwise
# abort the run; their runtime behaviour is covered by the importer tests.
ignore_missing_imports = True

# Check the body of every function, annotated or not.
check_untyped_defs = True

# Keep the remaining annotations honest.
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True

show_error_codes = True
pretty = True
