name: Tests

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    env:
      QT_QPA_PLATFORM: offscreen
      WDC_REQUIRE_GUI_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install Python and development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Type-check the calculation core
        run: python -m mypy
      - name: Compile Python modules
        run: python -m compileall -q modules gui tests tools build_database.py build_gunco_tables.py build_riven_tables.py main.py
      - name: Run full suite, including real Qt widgets
        run: python tools/run_tests_ci.py

  packaging:
    name: Packaged Windows smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install packaging dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build and exercise an isolated offscreen bundle
        run: python tests/run_packaging_smoke.py
