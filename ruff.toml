# Ruff configuration for the Warframe Damage Calculator.
#
# CI runs `python -m ruff check .`, so everything here is enforced: syntax and
# undefined names (E9, F), the pycodestyle errors that catch real mistakes
# (E7xx), warnings (W), import sorting (I), modern-Python upgrades (UP) and the
# bugbear rules (B) that catch closures over loop variables, `zip()` without
# `strict=`, and similar latent bugs.
#
# E501 is deliberately not enforced. The repository contains long prose
# tooltips in the Qt UI, single-line damage/faction data tables, and wiki URLs;
# wrapping them would either change displayed text or make the tables harder to
# audit against the wiki. `line-length` is still set so `ruff format` and any
# future E501 opt-in agree with the house style.
target-version = "py311"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["modules", "gui", "tools"]
